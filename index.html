<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Cert Trivia Wheel — an AWS Cloud Practitioner trivia booth game for AWS Community Day Sri Lanka, by AWS User Group Colombo." />
    <meta name="theme-color" content="#131822" />
    <title>Cert Trivia Wheel — AWS Community Day Sri Lanka</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

      html, body { background: #131822; margin: 0; }
